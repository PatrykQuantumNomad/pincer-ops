  <!--
    Golden Ratio Proportions (φ = 1.618):
    ═══════════════════════════════════════
    Overall bounding box:  262w × 426h  → 1:1.626 ≈ φ
    Head : Arms split:     163 : 263    → 1:1.613 ≈ φ
    Hinge block:           90w × 55h    → 1.636:1 ≈ φ
    Shaft:                 36w × 58h    → 1:1.611 ≈ φ
    Arm spread : arm len:  262 : 263    → ≈ 1:1 (circle-like U)
    Widest point at φ split of arm length: y ≈ 372
  -->

  <!-- Shaft (36 × 58, ratio 1:1.611 ≈ φ) -->
  <rect class="mark" x="238" y="46" width="36" height="58"/>

  <!-- Collar (accent band) -->
  <rect class="mark" x="228" y="104" width="56" height="14"/>

  <!-- Connector -->
  <rect class="mark" x="222" y="118" width="68" height="36" rx="2"/>

  <!-- Hinge block (90 × 55, ratio 1.636 ≈ φ) -->
  <rect class="mark" x="211" y="154" width="90" height="55" rx="3"/>

  <!-- Hinge pivot -->
  <circle cx="256" cy="182" r="14" fill="#fff"/>
  <circle class="mark" cx="256" cy="182" r="5"/>

  <!-- Left arm -->
  <path class="mark" d="
    M 211 196
