# statefulset.yaml -- OpenShell gateway StatefulSet.
#
# Pre-rendered from deploy/helm/openshell v0.1.0, image tag 0.0.12.
# Single-replica stateful workload with SQLite database on a PVC.
# The gateway is the control plane API server that coordinates sandbox
# lifecycle via gRPC/HTTP on port 8080.
#
# TLS is disabled via OPENSHELL_DISABLE_TLS for dev; Phase 29 enables mTLS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openshell
  namespace: openshell
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: openshell
spec:
  serviceName: openshell
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell
        app.kubernetes.io/instance: openshell
    spec:
      serviceAccountName: openshell
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openshell-gateway
          image: ghcr.io/nvidia/openshell/gateway:0.0.12
          imagePullPolicy: IfNotPresent
          args:
            - --port
            - "8080"
            - --log-level
            - info
            - --db-url
            - sqlite:/var/openshell/openshell.db
          ports:
            - containerPort: 8080
              name: grpc
              protocol: TCP
          env:
            - name: OPENSHELL_SANDBOX_NAMESPACE
              value: "openshell"
            - name: OPENSHELL_SANDBOX_IMAGE
              value: "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
            - name: OPENSHELL_GRPC_ENDPOINT
              value: "http://openshell.openshell.svc.cluster.local:8080"
            - name: OPENSHELL_SSH_HANDSHAKE_SECRET
              value: "dev-placeholder-not-a-real-secret"
            - name: OPENSHELL_DISABLE_TLS
              value: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: openshell-data
              mountPath: /var/openshell
  volumeClaimTemplates:
    - metadata:
        name: openshell-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
