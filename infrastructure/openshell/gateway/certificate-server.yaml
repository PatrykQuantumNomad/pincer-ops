# certificate-server.yaml -- Gateway server TLS Certificate.
#
# Issued by openshell-ca-issuer for the gateway gRPC endpoint.
# DNS names cover all in-cluster Service resolution forms.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-server-tls
  namespace: openshell
spec:
  secretName: openshell-server-tls
  duration: 2160h     # 90 days
  renewBefore: 360h   # 15 days
  commonName: openshell
  dnsNames:
    - openshell
    - openshell.openshell
    - openshell.openshell.svc
    - openshell.openshell.svc.cluster.local
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: openshell-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
