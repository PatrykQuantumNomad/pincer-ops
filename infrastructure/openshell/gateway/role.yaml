# role.yaml -- Namespace-scoped Role for Sandbox CRUD operations.
#
# Pre-rendered from deploy/helm/openshell v0.1.0, image tag 0.0.12.
# Grants the gateway full lifecycle management of Sandbox CRs in the
# openshell namespace, plus read access to events for status tracking.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-sandbox
  namespace: openshell
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: openshell
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
