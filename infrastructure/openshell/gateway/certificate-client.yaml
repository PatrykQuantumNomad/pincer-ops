# certificate-client.yaml -- Sandbox client TLS Certificate.
#
# Issued by openshell-ca-issuer for sandbox-to-gateway mTLS.
# Mounted by sandbox pods to authenticate against the gateway.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-client-tls
  namespace: openshell
spec:
  secretName: openshell-client-tls
  duration: 2160h     # 90 days
  renewBefore: 360h   # 15 days
  commonName: openshell-client
  usages:
    - digital signature
    - key encipherment
    - client auth
  issuerRef:
    name: openshell-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
