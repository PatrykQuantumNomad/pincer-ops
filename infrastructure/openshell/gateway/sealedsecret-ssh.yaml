# sealedsecret-ssh.yaml -- SealedSecret for SSH handshake secret.
#
# Re-seal with:
#   kubectl create secret generic openshell-ssh-handshake \
#     --from-literal=secret=$(openssl rand -hex 32) \
#     -n openshell --dry-run=client -o yaml \
#     | kubeseal --controller-namespace kube-system -o yaml \
#     > sealedsecret-ssh.yaml
#
# The encrypted value below is a placeholder. The real sealing happens
# during bootstrap via kubeseal against the live cluster's certificate.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openshell-ssh-handshake
  namespace: openshell
spec:
  encryptedData:
    secret: AgBmR3VpZGVkQnlDZXJ0TWFuYWdlckNsdXN0ZXJJc3N1ZXIuT3BlblNoZWxsQ0EuU2VhbGVkU2VjcmV0UGxhY2Vob2xkZXI=
  template:
    metadata:
      name: openshell-ssh-handshake
      namespace: openshell
