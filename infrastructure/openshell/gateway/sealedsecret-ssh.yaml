# sealedsecret-ssh.yaml -- SealedSecret for SSH handshake secret.
#
# Re-seal with:
#   kubectl create secret generic openshell-ssh-handshake \
#     --from-literal=secret=$(openssl rand -hex 32) \
#     -n openshell --dry-run=client -o yaml \
#     | kubeseal --controller-namespace kube-system -o yaml \
#     > sealedsecret-ssh.yaml
#
# This value is sealed against the current cluster's sealing key.
# After make down/up, re-seal if the sealing key was not restored.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openshell-ssh-handshake
  namespace: openshell
spec:
  encryptedData:
    secret: 
  template:
    metadata:
      name: openshell-ssh-handshake
      namespace: openshell
