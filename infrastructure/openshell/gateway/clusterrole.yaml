# clusterrole.yaml -- ClusterRole for cluster-scoped gateway permissions.
#
# Pre-rendered from deploy/helm/openshell v0.1.0, image tag 0.0.12.
# Grants read access to nodes and runtimeclasses so the gateway can
# inspect cluster topology and available container runtimes for sandbox
# scheduling decisions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshell-sandbox-runtimeclass
  labels:
    app.kubernetes.io/name: openshell
    app.kubernetes.io/instance: openshell
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
