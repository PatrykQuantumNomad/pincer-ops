# backup-cronjob.yaml -- Automated daily backup of Sealed Secrets sealing keys.
#
# Requires the ServiceAccount defined in backup-rbac.yaml with RBAC
# permissions to read secrets in kube-system. Uses the label selector
# sealedsecrets.bitnami.com/sealed-secrets-key to find sealing key secrets.
#
# Backups are stored on a hostPath volume (/tmp/sealed-secrets-backups)
# which is ephemeral on KIND -- lost on cluster teardown. This is acceptable
# for dev; production would use external encrypted storage.
#
# bitnami/kubectl:1.32 chosen for kubectl CLI access in a minimal image.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sealed-secrets-key-backup
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sealed-secrets-key-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sealed-secrets-key-backup
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: sealed-secrets-key-backup
          containers:
            - name: backup
              image: bitnami/kubectl:1.32
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backups/sealed-secrets-key-${TIMESTAMP}.yaml"
                  echo "Starting sealing key backup: ${BACKUP_FILE}"
                  kubectl get secret -n kube-system \
                    -l sealedsecrets.bitnami.com/sealed-secrets-key \
                    -o yaml > "${BACKUP_FILE}"
                  echo "Sealing key backup created successfully: ${BACKUP_FILE}"
                  echo "Cleaning up old backups (retaining last 7)..."
                  ls -t /backups/sealed-secrets-key-*.yaml | tail -n +8 | xargs rm -f 2>/dev/null || true
                  echo "Backup complete."
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
          restartPolicy: OnFailure
          volumes:
            - name: backups
              hostPath:
                path: /tmp/sealed-secrets-backups
                type: DirectoryOrCreate
