# kustomization.yaml -- Sealed Secrets controller via remote resource.
# References the official Bitnami Sealed Secrets controller manifest
# (CRDs, controller Deployment, Service, RBAC) pinned to v0.35.0.
# Update the URL tag to upgrade Sealed Secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.35.0/controller.yaml
