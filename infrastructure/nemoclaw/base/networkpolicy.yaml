# networkpolicy.yaml -- Default-deny baseline for the nemoclaw namespace.
#
# Blocks all ingress and egress traffic for every pod in the namespace.
# Phase 19 (LiteLLM Proxy Deployment) adds specific allow rules on top of
# this deny-all baseline (DNS egress, HTTPS egress, ingress from OpenClaw).
#
# Do NOT add allow rules here -- this file is the deny-all foundation only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: nemoclaw
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
