# namespace.yaml -- NemoClaw governance namespace with Pod Security Standards enforcement.
#
# PSS restricted profile enforced from day one. All workloads deployed into this
# namespace (LiteLLM proxy in Phase 19, future governance components) must comply
# with the restricted security standard:
#   - No privileged containers
#   - No host namespaces or host ports
#   - Non-root UID required (runAsNonRoot: true)
#   - Seccomp profile required (RuntimeDefault or Localhost)
#   - Capabilities dropped (no NET_RAW, SYS_ADMIN, etc.)
#
# This namespace is created by ArgoCD applying this manifest directly.
# Do NOT use CreateNamespace=true in the ArgoCD Application.
apiVersion: v1
kind: Namespace
metadata:
  name: nemoclaw
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
