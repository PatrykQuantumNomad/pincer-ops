# patch-deployment.yaml -- Hardening patch for the agent-sandbox controller.
#
# The upstream manifest.yaml Deployment has no probes, resource requests/limits,
# securityContext, or imagePullPolicy. This patch adds all four to comply with:
#   - Repo conventions: explicit resources, probes on all long-running workloads
#   - PSS restricted: runAsNonRoot, capabilities.drop ALL, seccomp RuntimeDefault
#   - KIND compatibility: imagePullPolicy IfNotPresent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
spec:
  template:
    spec:
      containers:
      - name: agent-sandbox-controller
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
