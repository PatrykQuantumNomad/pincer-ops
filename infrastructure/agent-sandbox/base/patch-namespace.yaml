# patch-namespace.yaml -- PSS restricted labels for the agent-sandbox-system namespace.
#
# The upstream manifest.yaml defines a bare Namespace without PSS labels.
# This strategic merge patch adds all 6 PSS restricted labels to enforce
# the restricted security standard on all pods in this namespace.
#
# See namespace.yaml for the full PSS documentation and rationale.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
