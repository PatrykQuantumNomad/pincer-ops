# infra-envoy-gateway-config.yaml -- ArgoCD Application for Gateway API config resources.
#
# Kustomize-source Application managing EnvoyProxy, GatewayClass, and Gateway
# resources at infrastructure/envoy-gateway/base. These configure the Envoy proxy
# as a DaemonSet with hostPort binding for KIND/macOS localhost access.
#
# Requires Envoy Gateway CRDs (EnvoyProxy, Gateway API kinds) to be present.
# KIND: CRDs installed by infra-envoy-gateway (wave -4).
# Kinder: CRDs installed by Kinder addon during cluster creation.
#
# NOTE: bootstrap.sh tries ArgoCD sync first with kustomize direct-apply fallback
# if the repo is unreachable (same pattern as MetalLB, Sealed Secrets, cert-manager).
#
# Lives in bootstrap/ so root-app discovers it via recursive directory scan.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-envoy-gateway-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/envoy-gateway/base
    notifications.argoproj.io/subscribe.on-sync-failed.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-health-degraded.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-sync-status-unknown.platform-webhook: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/PatrykQuantumNomad/pincer-ops.git
    targetRevision: main
    path: infrastructure/envoy-gateway/base
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
