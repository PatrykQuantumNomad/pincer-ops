# infra-envoy-gateway.yaml -- ArgoCD Application for Envoy Gateway controller.
#
# OCI Helm source Application (not Git-based). ArgoCD pulls the chart directly
# from docker.io/envoyproxy OCI registry. This installs the Envoy Gateway
# controller, CRDs (Gateway API + Envoy Gateway), and supporting resources.
#
# The controller must be healthy before the config Application (infra-envoy-gateway-config)
# can apply EnvoyProxy, GatewayClass, and Gateway resources that depend on the CRDs.
#
# Lives in bootstrap/ so root-app discovers it via recursive directory scan.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    notifications.argoproj.io/subscribe.on-sync-failed.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-health-degraded.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-sync-status-unknown.platform-webhook: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    chart: gateway-helm
    repoURL: docker.io/envoyproxy
    targetRevision: v1.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
