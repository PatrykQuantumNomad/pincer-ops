# infra-agent-sandbox.yaml -- ArgoCD Application for the agent-sandbox CRD controller.
#
# Deploys the agent-sandbox CRD controller (Sandbox CRD, controller Deployment,
# RBAC, Service) with PSS restricted enforcement. The controller reconciles
# Sandbox CRs into pods in later phases.
#
# v2.0 Sync Wave Map:
#   Wave -10: ArgoCD self-management + AppProjects
#   Wave  -5: MetalLB (KIND only)
#   Wave  -4: Envoy Gateway controller (KIND only)
#   Wave  -3: Sealed Secrets
#   Wave  -2: cert-manager (KIND only)
#   Wave  -1: Envoy Gateway config
#   Wave   0: infra-openshell
#   Wave   2: infra-agent-sandbox [this app] -- CRD controller, needs namespace from wave 0
#   Wave  +5: workload-openshell-gateway
#   Wave +10: workload-openclaw
#
# Lives in bootstrap/ so root-app discovers it via recursive directory scan.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-agent-sandbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/agent-sandbox
    notifications.argoproj.io/subscribe.on-sync-failed.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-health-degraded.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-sync-status-unknown.platform-webhook: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openshell
  source:
    repoURL: https://github.com/PatrykQuantumNomad/pincer-ops.git
    targetRevision: main
    path: infrastructure/agent-sandbox/base
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-sandbox-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
