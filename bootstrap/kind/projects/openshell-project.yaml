# openshell-project.yaml -- AppProject for the OpenShell sandbox stack.
#
# Groups the OpenShell gateway (openshell namespace) and agent-sandbox
# controller (agent-sandbox-system namespace) as a single security boundary.
# Both namespaces share lifecycle, RBAC scope, and deployment ownership.
#
# Cluster-scoped resources allowed:
#   - Namespace: namespace manifests are managed by ArgoCD Applications
#   - CustomResourceDefinition: Sandbox CRD registration (Phase 24)
#   - ClusterRole / ClusterRoleBinding: gateway RBAC for sandbox lifecycle (Phase 25)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openshell
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: "OpenShell sandbox stack -- gateway and agent-sandbox controller"
  sourceRepos:
    - 'https://github.com/PatrykQuantumNomad/pincer-ops.git'
  destinations:
    - namespace: 'openshell'
      server: https://kubernetes.default.svc
    - namespace: 'agent-sandbox-system'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
  namespaceResourceBlacklist: []
