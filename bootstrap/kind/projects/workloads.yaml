# workloads.yaml -- AppProject for application workloads.
# Restricted to the 'nemoclaw' namespace. Only cluster-scoped resource allowed
# is Namespace (required by CreateNamespace=true sync option).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: "Application workloads -- namespace-scoped only (nemoclaw)"
  sourceRepos:
    - 'https://github.com/PatrykQuantumNomad/pincer-ops.git'
  destinations:
    - namespace: 'nemoclaw'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceBlacklist: []
