# infra-sealed-secrets.yaml -- ArgoCD Application for Bitnami Sealed Secrets.
#
# Lives in bootstrap/ so root-app discovers it via recursive directory scan.
# Manages Sealed Secrets controller installation through kustomize remote
# resource at infrastructure/sealed-secrets/base (CRDs, controller, RBAC).
#
# The controller runs in kube-system (upstream default) to avoid requiring
# extra --controller-namespace flags with the kubeseal CLI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/sealed-secrets/base
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/PatrykQuantumNomad/pincer-ops.git
    targetRevision: main
    path: infrastructure/sealed-secrets/base
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
