# infra-metallb.yaml -- ArgoCD Application for MetalLB L2 load balancer.
#
# Lives in bootstrap/ so root-app discovers it via recursive directory scan.
# Manages MetalLB installation through kustomize remote resource at
# infrastructure/metallb/base (CRDs, controller, speaker, webhooks, RBAC).
#
# IPAddressPool and L2Advertisement are NOT managed here -- they are applied
# by bootstrap.sh because the address range is derived dynamically from the
# KIND Docker network CIDR at cluster creation time.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/metallb/base
    notifications.argoproj.io/subscribe.on-sync-failed.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-health-degraded.platform-webhook: ""
    notifications.argoproj.io/subscribe.on-sync-status-unknown.platform-webhook: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/PatrykQuantumNomad/pincer-ops.git
    targetRevision: main
    path: infrastructure/metallb/base
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
