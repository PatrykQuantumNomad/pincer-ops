# sealed-secret.yaml -- Encrypted credentials for OpenClaw Gateway.
#
# Contains only OPENCLAW_GATEWAY_TOKEN (random hex token for gateway auth).
# LLM provider keys (ANTHROPIC_API_KEY, etc.) are configured post-deployment
# via the OpenClaw onboarding UI at localhost:18789.
#
# To re-seal after a cluster rebuild:
#   TOKEN=$(openssl rand -hex 16)
#   kubectl create secret generic openclaw-credentials \
#     --from-literal="OPENCLAW_GATEWAY_TOKEN=$TOKEN" \
#     --namespace=openclaw --dry-run=client -o yaml | kubeseal --format yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openclaw-credentials
  namespace: openclaw
spec:
  encryptedData:
    OPENCLAW_GATEWAY_TOKEN: 
  template:
    metadata:
      name: openclaw-credentials
      namespace: openclaw
    type: Opaque
