# statefulset.yaml -- OpenClaw Gateway StatefulSet.
#
# Single-replica stateful workload with PVC for session data. An initContainer
# seeds openclaw.json from the ConfigMap on first deploy; subsequent writes
# (onboarding wizard, UI settings) go directly to the PVC.
#
# The --bind lan flag is CRITICAL: without it the gateway binds to loopback
# and the Service cannot route traffic to the pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openclaw-gateway
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw-gateway
spec:
  serviceName: openclaw-gateway
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-gateway
    spec:
      initContainers:
        - name: seed-config
          image: ghcr.io/openclaw/openclaw:2026.2.19
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_GATEWAY_TOKEN
          command:
            - sh
            - -c
            - |
              CFG=/home/node/.openclaw/openclaw.json
              if [ ! -f "$CFG" ] || ! node -e "require('$CFG')" 2>/dev/null; then
                echo "seed-config: seeding openclaw.json from ConfigMap"
                cp /config/openclaw.json "$CFG"
                chown 1000:1000 "$CFG"
              else
                # Ensure the gateway token in the config matches the env var
                CURRENT=$(node -e "try{const c=require('$CFG');console.log(c.gateway?.auth?.token||'')}catch(e){}" 2>/dev/null)
                if [ "$CURRENT" != "$OPENCLAW_GATEWAY_TOKEN" ]; then
                  echo "seed-config: updating gateway token to match env var"
                  node -e "
                    const fs=require('fs');
                    const c=JSON.parse(fs.readFileSync('$CFG','utf8'));
                    c.gateway=c.gateway||{};
                    c.gateway.auth=c.gateway.auth||{};
                    c.gateway.auth.token='$OPENCLAW_GATEWAY_TOKEN';
                    fs.writeFileSync('$CFG',JSON.stringify(c,null,2)+'\n');
                  "
                  chown 1000:1000 "$CFG"
                fi
              fi
              chown -R 1000:1000 /home/node/.openclaw
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: openclaw-gateway
          image: ghcr.io/openclaw/openclaw:2026.2.19
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
          ports:
            - containerPort: 18789
              name: gateway
              protocol: TCP
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: NODE_ENV
              value: "production"
            - name: HOME
              value: "/home/node"
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 60
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: openclaw-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
