# statefulset.yaml -- OpenClaw Gateway StatefulSet.
#
# Single-replica stateful workload with PVC for session data and ConfigMap
# subPath mount for openclaw.json configuration. The --bind lan flag is
# CRITICAL: without it the gateway binds to loopback and the Service cannot
# route traffic to the pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openclaw-gateway
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw-gateway
spec:
  serviceName: openclaw-gateway
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-gateway
    spec:
      containers:
        - name: openclaw-gateway
          image: ghcr.io/openclaw/openclaw:2026.2.19
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
          ports:
            - containerPort: 18789
              name: gateway
              protocol: TCP
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-credentials
                  key: ANTHROPIC_API_KEY
            - name: NODE_ENV
              value: "production"
            - name: HOME
              value: "/home/node"
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /home/node/.openclaw/openclaw.json
              subPath: openclaw.json
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - node
                - dist/index.js
                - health
                - --timeout
                - "5000"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - dist/index.js
                - health
                - --timeout
                - "5000"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: openclaw-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
