# service.yaml -- ClusterIP Service exposing OpenClaw Gateway on port 18789.
apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw-gateway
spec:
  type: ClusterIP
  ports:
    - port: 18789
      targetPort: gateway
      protocol: TCP
      name: gateway
  selector:
    app.kubernetes.io/name: openclaw-gateway
