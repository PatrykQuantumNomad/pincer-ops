# configmap.yaml -- OpenClaw seed configuration (openclaw.json).
#
# Copied to the PVC by the seed-config initContainer on first deploy only.
# Once on the PVC, the onboarding wizard and UI manage this file directly.
# To re-seed, delete the file from the PVC and restart the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "port": 18789,
        "mode": "local",
        "auth": {
          "mode": "token"
        }
      }
    }
