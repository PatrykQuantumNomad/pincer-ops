# httproute.yaml -- Gateway API HTTPRoute for OpenClaw.
#
# Routes traffic from the Envoy Gateway (eg) in envoy-gateway-system to the
# OpenClaw Service. The Gateway has allowedRoutes.namespaces.from: All, so
# this cross-namespace attachment works without a ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw-gateway
  namespace: openclaw
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openclaw-gateway
          port: 18789
