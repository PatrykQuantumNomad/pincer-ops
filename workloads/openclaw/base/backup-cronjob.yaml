# backup-cronjob.yaml -- Automated daily backup of OpenClaw PVC data.
#
# IMPORTANT: The PVC data-openclaw-gateway-0 uses ReadWriteOnce (RWO) access
# mode, meaning only pods on the SAME NODE can mount it. The podAffinity rule
# below ensures this backup pod is always co-located with the StatefulSet pod.
#
# Backups are stored on a hostPath volume (/tmp/openclaw-backups) which is
# ephemeral on KIND -- lost on cluster teardown. This is acceptable for dev;
# production would use an external storage backend (S3, NFS, etc.).
#
# busybox:1.37 chosen for minimal image footprint (tar, sh, ls, date built-in).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openclaw-backup
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openclaw-backup
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: openclaw-backup
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: openclaw-gateway
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: busybox:1.37
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backups/openclaw-${TIMESTAMP}.tar.gz"
                  echo "Starting OpenClaw PVC backup: ${BACKUP_FILE}"
                  tar czf "${BACKUP_FILE}" -C /data .
                  echo "Backup created successfully: ${BACKUP_FILE}"
                  echo "Cleaning up old backups (retaining last 7)..."
                  ls -t /backups/openclaw-*.tar.gz | tail -n +8 | xargs rm -f 2>/dev/null || true
                  echo "Backup complete."
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-openclaw-gateway-0
                readOnly: true
            - name: backups
              hostPath:
                path: /tmp/openclaw-backups
                type: DirectoryOrCreate
