# deployment.yaml -- LiteLLM Proxy Deployment.
#
# Routes inference requests from OpenClaw to LLM providers (NVIDIA NIM,
# OpenAI, Anthropic) while isolating API credentials via SealedSecret.
# Uses the litellm-non_root image which runs as UID 65534 (nobody).
#
# readOnlyRootFilesystem is false because LiteLLM writes temp files at
# runtime. Phase 20 will harden this with an emptyDir if feasible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: nemoclaw
  labels:
    app.kubernetes.io/name: litellm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-proxy
    spec:
      containers:
        - name: litellm-proxy
          image: ghcr.io/berriai/litellm-non_root:main-v1.82.3-stable
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/proxy_server_config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          env:
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: NVIDIA_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-keys
                  key: ANTHROPIC_API_KEY
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/proxy_server_config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
