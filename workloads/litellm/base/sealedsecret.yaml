# sealedsecret.yaml -- SealedSecret for LiteLLM API keys.
#
# PLACEHOLDER: The encryptedData values below are NOT real encrypted data.
# After cluster bootstrap, create a plain Secret YAML with real API keys:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: litellm-api-keys
#     namespace: nemoclaw
#   type: Opaque
#   stringData:
#     NVIDIA_API_KEY: "nvapi-..."
#     OPENAI_API_KEY: "sk-..."
#     ANTHROPIC_API_KEY: "sk-ant-..."
#
# Then seal it:
#   make seal FILE=path/to/litellm-api-keys-secret.yaml
#
# Replace the encryptedData in this file with the output and commit.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: litellm-api-keys
  namespace: nemoclaw
spec:
  encryptedData:
    NVIDIA_API_KEY: PLACEHOLDER-run-make-seal-after-bootstrap
    OPENAI_API_KEY: PLACEHOLDER-run-make-seal-after-bootstrap
    ANTHROPIC_API_KEY: PLACEHOLDER-run-make-seal-after-bootstrap
  template:
    metadata:
      name: litellm-api-keys
      namespace: nemoclaw
    type: Opaque
