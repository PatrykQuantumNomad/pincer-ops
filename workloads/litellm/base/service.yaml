# service.yaml -- ClusterIP Service exposing LiteLLM Proxy on port 4000.
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: nemoclaw
  labels:
    app.kubernetes.io/name: litellm-proxy
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: litellm-proxy
