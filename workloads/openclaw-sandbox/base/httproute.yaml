# httproute.yaml -- Gateway API HTTPRoute for OpenClaw Sandbox.
#
# Routes traffic from the Envoy Gateway (eg) in envoy-gateway-system to the
# OpenClaw Sandbox pod via the openclaw-gateway ClusterIP Service. The Gateway
# has allowedRoutes.namespaces.from: All, so this cross-namespace attachment
# works without a ReferenceGrant.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw-gateway
  namespace: openshell
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: openclaw-gateway
          port: 18789
          weight: 1
