# configmap.yaml -- OpenClaw seed configuration (openclaw.json).
#
# Copied to the PVC by the seed-config initContainer on first deploy only.
# Once on the PVC, the onboarding wizard and UI manage this file directly.
# To re-seed, delete the file from the PVC and restart the pod.
#
# Inference routing: OpenClaw connects to https://inference.local/v1 which is
# the OpenShell privacy router running inside the supervisor binary. The
# privacy router strips sandbox-provided credentials and injects the real
# API key before forwarding to the upstream LLM provider.
#
# OPENCLAW_GATEWAY_TOKEN is also set as an env var on the gateway container.
# The gateway uses it to auto-pair CLI WebSocket connections (same pattern as
# the upstream docker-compose). The token in openclaw.json and the env var
# must match for CLI commands to work without manual device pairing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openshell
data:
  # Shared gateway token — used by both openclaw.json and the env var.
  # To rotate: change this value, delete the PVC config, and restart the pod.
  OPENCLAW_GATEWAY_TOKEN: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6"
  openclaw.json: |
    {
      "gateway": {
        "port": 18789,
        "mode": "local",
        "auth": {
          "mode": "token",
          "token": "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6"
        }
      },
      "models": {
        "providers": {
          "openshell": {
            "baseUrl": "https://inference.local/v1",
            "apiKey": "no-key-required",
            "api": "openai-completions",
            "models": [
              {
                "id": "gpt-4o",
                "name": "GPT-4o (via OpenShell)"
              }
            ]
          }
        }
      }
    }
