# sandbox.yaml -- OpenClaw running as a Sandbox CR with supervisor isolation.
#
# The openshell-sandbox supervisor runs as PID 1, enforcing Landlock filesystem
# restrictions, seccomp-BPF syscall filtering, and network namespace isolation.
# The supervisor wraps the OpenClaw node process and communicates with the
# OpenShell gateway for policy delivery via gRPC.
#
# The agent-sandbox controller reconciles this into a Pod, headless Service,
# and PVC. The stable hostname is openclaw-sandbox.openshell.svc.cluster.local.
apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: openclaw-sandbox
  namespace: openshell
  labels:
    openshell.ai/managed-by: openshell
    openshell.ai/sandbox-id: openclaw-sandbox
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-gateway
        sandbox: openclaw-sandbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      initContainers:
        - name: seed-config
          image: ghcr.io/openclaw/openclaw:2026.3.13-1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_GATEWAY_TOKEN
          command:
            - sh
            - -c
            - |
              CFG=/home/node/.openclaw/openclaw.json
              if [ ! -f "$CFG" ] || ! node -e "require('$CFG')" 2>/dev/null; then
                echo "seed-config: seeding openclaw.json from ConfigMap"
                cp /config/openclaw.json "$CFG"
                chown 1000:1000 "$CFG"
              else
                CURRENT=$(node -e "try{const c=require('$CFG');console.log(c.gateway?.auth?.token||'')}catch(e){}" 2>/dev/null)
                if [ "$CURRENT" != "$OPENCLAW_GATEWAY_TOKEN" ]; then
                  echo "seed-config: updating gateway token to match env var"
                  node -e "
                    const fs=require('fs');
                    const c=JSON.parse(fs.readFileSync('$CFG','utf8'));
                    c.gateway=c.gateway||{};
                    c.gateway.auth=c.gateway.auth||{};
                    c.gateway.auth.token='$OPENCLAW_GATEWAY_TOKEN';
                    fs.writeFileSync('$CFG',JSON.stringify(c,null,2)+'\n');
                  "
                  chown 1000:1000 "$CFG"
                fi
              fi
              chown -R 1000:1000 /home/node/.openclaw
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openclaw-gateway
          image: ghcr.io/openclaw/openclaw:2026.3.13-1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN", "NET_ADMIN", "SYS_PTRACE", "SYSLOG"]
          command:
            - /opt/openshell/bin/openshell-sandbox
          ports:
            - containerPort: 18789
              name: gateway
              protocol: TCP
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: NODE_ENV
              value: "production"
            - name: HOME
              value: "/home/node"
            - name: OPENSHELL_SANDBOX_COMMAND
              value: "node dist/index.js gateway --bind lan --port 18789"
            - name: OPENSHELL_ENDPOINT
              value: "https://openshell.openshell.svc.cluster.local:8080"
            - name: OPENSHELL_SANDBOX_ID
              value: "openclaw-sandbox"
            - name: OPENSHELL_SANDBOX
              value: "openclaw-sandbox"
            - name: OPENSHELL_LOG_LEVEL
              value: "info"
            - name: OPENSHELL_TLS_CA
              value: "/etc/openshell-tls/client/ca.crt"
            - name: OPENSHELL_TLS_CERT
              value: "/etc/openshell-tls/client/tls.crt"
            - name: OPENSHELL_TLS_KEY
              value: "/etc/openshell-tls/client/tls.key"
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
            - name: supervisor-bin
              mountPath: /opt/openshell/bin
              readOnly: true
            - name: tls-client
              mountPath: /etc/openshell-tls/client
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 60
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: openclaw-config
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: cache
          emptyDir:
            sizeLimit: 100Mi
        - name: supervisor-bin
          hostPath:
            path: /opt/openshell/bin
            type: Directory
        - name: tls-client
          secret:
            secretName: openshell-client-tls
            defaultMode: 256
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
