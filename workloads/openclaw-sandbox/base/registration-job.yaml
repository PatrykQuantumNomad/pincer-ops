# Registration Job: Injects security policy into the OpenShell gateway database.
#
# Why PostSync (not sync wave 11):
#   PostSync hooks run AFTER all resources in the Application's Sync phase complete,
#   guaranteeing the Sandbox CR exists in the cluster. Regular Jobs at sync wave 11
#   would suffer from immutable field errors on re-sync. PostSync hooks with
#   BeforeHookCreation delete the old Job before creating a new one, avoiding this.
#
# CLI config scaffolding:
#   The OpenShell CLI reads gateway metadata and mTLS certs from a directory structure
#   at ~/.config/openshell/gateways/<name>/. There are no --tls-cert flags; the Job
#   must scaffold this directory before running any CLI commands.
#
# Sandbox name:
#   The name passed to `openshell policy set <name>` must match the Sandbox CR
#   metadata.name exactly: "openclaw-sandbox" (from sandbox.yaml).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openclaw-sandbox-policy-registration
  namespace: openshell
  labels:
    app.kubernetes.io/name: openclaw-sandbox-registration
    app.kubernetes.io/component: policy-registration
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw-sandbox-registration
        app.kubernetes.io/component: policy-registration
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      initContainers:
        - name: install-cli
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              set -e
              echo "Downloading openshell CLI v0.0.12..."
              curl -LsSf \
                "https://github.com/NVIDIA/OpenShell/releases/download/v0.0.12/openshell-$(uname -m)-unknown-linux-musl.tar.gz" \
                | tar xz -C /cli
              chmod +x /cli/openshell
              echo "CLI installed successfully"
          volumeMounts:
            - name: cli-bin
              mountPath: /cli
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: register-policy
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          command:
            - sh
            - -c
            - |
              set -e

              # Scaffold openshell CLI config directory with mTLS certs
              GATEWAY_DIR="$HOME/.config/openshell/gateways/local"
              mkdir -p "$GATEWAY_DIR/mtls"
              cp /tls/ca.crt "$GATEWAY_DIR/mtls/ca.crt"
              cp /tls/tls.crt "$GATEWAY_DIR/mtls/tls.crt"
              cp /tls/tls.key "$GATEWAY_DIR/mtls/tls.key"

              # Write gateway metadata
              cat > "$GATEWAY_DIR/metadata.json" <<'EOF'
              {"endpoint":"https://openshell.openshell.svc.cluster.local:8080","auth":"mtls"}
              EOF

              # Set active gateway
              echo "local" > "$HOME/.config/openshell/active_gateway"

              echo "Registering policy for sandbox openclaw-sandbox..."
              /cli/openshell policy set openclaw-sandbox \
                --policy /policy/policy.yaml \
                --wait

              echo "Policy registration complete"
          volumeMounts:
            - name: cli-bin
              mountPath: /cli
              readOnly: true
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: tls-client
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: cli-bin
          emptyDir:
            sizeLimit: 50Mi
        - name: policy
          configMap:
            name: openshell-sandbox-policy
        - name: tls-client
          secret:
            secretName: openshell-client-tls
