# service.yaml -- ClusterIP Service for OpenClaw HTTPRoute routing.
#
# The agent-sandbox controller creates a headless Service (no ClusterIP, no ports)
# for DNS hostname resolution. Envoy Gateway requires a ClusterIP Service with
# explicit ports for HTTPRoute backend routing. This Service targets the same
# pod label as the controller-created headless Service.
apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
  namespace: openshell
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openclaw-gateway
  ports:
    - name: gateway
      protocol: TCP
      port: 18789
      targetPort: 18789
