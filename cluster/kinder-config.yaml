# Kinder cluster configuration for Pincer Ops
# Creates a 3-node cluster: 1 control-plane + 2 workers
# Control-plane node has ingress-ready label and host port mappings for 80/443
#
# NOTE: This file uses Kinder-specific extensions (the `addons` section).
# Upstream KIND would reject this file because the addons field is not part of
# the KIND Cluster schema. Kinder reads this same format but extends it with
# addon management -- addons listed here are installed automatically during
# cluster creation, replacing manual post-create bootstrap steps.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  labels:
    ingress-ready: "true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
- role: worker
addons:
  metalLB: true
  envoyGateway: true
  certManager: true
  metricsServer: true
  coreDNSTuning: true
  dashboard: true
  localRegistry: false
  nvidiaGPU: false
