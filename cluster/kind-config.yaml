# KIND cluster configuration for Pincer Ops
# Creates a 3-node cluster: 1 control-plane + 2 workers
# Control-plane node has ingress-ready label and host port mappings for 80/443
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  labels:
    ingress-ready: "true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
- role: worker
